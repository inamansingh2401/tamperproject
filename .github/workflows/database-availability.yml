name: SafeTrack database availability

# Cloud-only, low-volume read checks; no application deployment or telemetry.
on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: safetrack-database-availability
  cancel-in-progress: false

jobs:
  database-read:
    if: github.repository == 'inamansingh2401/tamperproject'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # No checkout: no application source or uncommitted local files are used.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned PostgreSQL client
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'psycopg[binary]==3.3.4'
      - name: Check database without reading or writing application records
        env:
          KEEPALIVE_DATABASE_URL: ${{ secrets.SAFETRACK_KEEPALIVE_DATABASE_URL }}
        shell: python
        run: |
          import os
          import hashlib
          import tempfile
          import time
          import urllib.request
          import psycopg

          connection = os.environ.get('KEEPALIVE_DATABASE_URL')
          if not connection:
              raise SystemExit('Missing private database configuration')
          # Official Supabase Studio download; pin the public CA, not a secret.
          certificate_url = 'https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt'
          with urllib.request.urlopen(certificate_url, timeout=15) as response:
              certificate = response.read(16384)
          if hashlib.sha256(certificate).hexdigest() != '700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7':
              raise SystemExit('Provider CA changed; review required before trusting it')
          certificate_file = os.path.join(tempfile.gettempdir(), 'safetrack-supabase-ca.crt')
          with open(certificate_file, 'wb') as target:
              target.write(certificate)

          for attempt in range(3):
              try:
                  with psycopg.connect(connection, connect_timeout=15,
                          sslmode='verify-full', sslrootcert=certificate_file,
                          application_name='safetrack_github_keepalive',
                          options='-c statement_timeout=5000 -c default_transaction_read_only=on') as db:
                      db.execute('SET TRANSACTION READ ONLY')
                      user, read_only, ready = db.execute(
                          "SELECT current_user, current_setting('transaction_read_only'), 1"
                      ).fetchone()
                      if (user, read_only, ready) != ('safetrack_keepalive', 'on', 1):
                          raise SystemExit('Unexpected account or transaction mode; refusing to continue')
                  print('PASS: restricted account connected; read-only database check succeeded')
                  break
              except psycopg.Error:
                  if attempt == 2:
                      raise SystemExit('Database check failed after three bounded attempts; connection details withheld') from None
                  time.sleep(5 * (attempt + 1))
