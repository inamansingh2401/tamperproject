<!DOCTYPE html>
<html lang="en">
<head>
<script src="common.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>SafeTrack Admin Console - Alerts & Incidents</title>

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="tailwind.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js" integrity="sha384-LtmWBcrD5iuFIR4sFphS8IiiaftkypL5dJzLKywbyd9ATLB7ZbPz3JYnI9nvXHkV" crossorigin="anonymous"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body class="bg-[#f8fafc] text-slate-800 font-sans min-h-screen flex antialiased selection:bg-blue-500 selection:text-white dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- MAIN LAYOUT WRAPPER -->
    <div class="flex w-full min-h-screen">

        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 bg-sidebar-bg text-sidebar-text flex flex-col shrink-0 border-r border-sidebar-border select-none z-40 transition-all duration-300">
            <div>
                <!-- Brand Header -->
                <div class="px-6 py-5 flex items-center gap-3 border-b border-sidebar-border/60">
                    <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-600/30 shrink-0">
                        <i data-lucide="shield-check" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-white text-base leading-tight tracking-tight">SafeTrack</h1>
                        <p class="text-[11px] text-slate-400 font-medium">Admin Console</p>
                    </div>
                </div>

                <!-- Navigation Section -->
                <div class="px-4 py-4 space-y-6">
                    <div>
                        <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2">Main Menu</p>
                        <nav class="space-y-1 text-xs font-medium">
                            <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-sidebar-hover text-slate-300 hover:text-white transition-all">
                                <i data-lucide="layout-grid" class="w-4 h-4 text-slate-400 shrink-0"></i>
                                <span>Dashboard</span>
                            </a>
                            <a href="shipments.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-sidebar-hover text-slate-300 hover:text-white transition-all">
                                <i data-lucide="package" class="w-4 h-4 text-slate-400 shrink-0"></i>
                                <span>Shipments</span>
                            </a>
                            <a href="vehicles.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-sidebar-hover text-slate-300 hover:text-white transition-all">
                                <i data-lucide="truck" class="w-4 h-4 text-slate-400 shrink-0"></i>
                                <span>Vehicles</span>
                            </a>
                            <a href="alerts.html" class="flex items-center justify-between px-3 py-2.5 rounded-xl bg-blue-600 text-white shadow-md shadow-blue-600/20 font-semibold transition-all">
                                <div class="flex items-center gap-3">
                                    <i data-lucide="alert-triangle" class="w-4 h-4 text-white shrink-0"></i>
                                    <span>Alerts & Incidents</span>
                                </div>
                                <span id="alertsCountBadge" class="bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-sm">7</span>
                            </a>
                            <a href="reports.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-sidebar-hover text-slate-300 hover:text-white transition-all">
                                <i data-lucide="bar-chart-3" class="w-4 h-4 text-slate-400 shrink-0"></i>
                                <span>Reports</span>
                            </a>
                            <a href="users.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-sidebar-hover text-slate-300 hover:text-white transition-all">
                                <i data-lucide="users" class="w-4 h-4 text-slate-400 shrink-0"></i>
                                <span>Users & Roles</span>
                            </a>
                            <a href="settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-sidebar-hover text-slate-300 hover:text-white transition-all">
                                <i data-lucide="settings" class="w-4 h-4 text-slate-400 shrink-0"></i>
                                <span>Settings</span>
                            </a>
                        </nav>
                    </div>
                </div>
            </div>

            <!-- Profile Footer -->
            <div class="mt-auto">
                <div class="p-4 border-t border-sidebar-border/60">
                    <div class="flex items-center justify-between gap-3 p-2.5 rounded-xl bg-sidebar-hover/60 hover:bg-rose-500/10 cursor-pointer transition-all border border-sidebar-border/40" onclick="SafeTrackAuth.logout()" title="Sign out">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full bg-blue-600 text-white font-bold text-xs flex items-center justify-center">
                                AS
                            </div>
                            <div>
                                <p class="text-xs font-bold text-white leading-tight">Admin Super</p>
                                <p class="text-[10px] text-slate-400 leading-tight">System Administrator</p>
                            </div>
                        </div>
                        <i data-lucide="log-out" class="w-4 h-4 text-slate-400 hover:text-rose-400"></i>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT WORKSPACE -->
        <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">

            <!-- TOP NAVBAR -->
            <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700/60 px-6 py-4 flex items-center justify-between sticky top-0 z-30 shadow-sm">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">Alerts & Incidents Management</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Security tamper events, temperature excursions, and shock alerts</p>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="markAllAlertsResolved()" class="flex items-center gap-2 px-3.5 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-emerald-600 hover:text-white text-slate-700 dark:text-slate-200 rounded-xl text-xs font-semibold transition-all">
                        <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                        <span>Mark All Resolved</span>
                    </button>
                    <button onclick="toggleDarkMode()" class="p-2 bg-slate-50 dark:bg-slate-700/60 border border-slate-200 dark:border-slate-600 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 transition-all shadow-sm">
                        <i data-lucide="sun" class="w-4 h-4 dark:hidden"></i>
                        <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
                    </button>
                </div>
            </header>

            <!-- PAGE BODY -->
            <div class="p-6 space-y-6">

                <!-- TABS & FILTER BAR -->
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
                    
                    <div class="flex items-center gap-2 p-1 bg-slate-100 dark:bg-slate-700/60 rounded-xl text-xs font-semibold">
                        <button onclick="filterAlertsTab('all', this)" class="alert-tab-btn px-3 py-1.5 rounded-lg bg-blue-600 text-white shadow-sm transition-all">
                            All Incidents
                        </button>
                        <button onclick="filterAlertsTab('Critical', this)" class="alert-tab-btn px-3 py-1.5 rounded-lg text-rose-600 dark:text-rose-400 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all">
                            Critical Only
                        </button>
                        <button onclick="filterAlertsTab('Warning', this)" class="alert-tab-btn px-3 py-1.5 rounded-lg text-amber-600 dark:text-amber-400 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all">
                            Warnings Only
                        </button>
                        <button onclick="filterAlertsTab('Resolved', this)" class="alert-tab-btn px-3 py-1.5 rounded-lg text-emerald-600 dark:text-emerald-400 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all">
                            Resolved
                        </button>
                    </div>

                    <div class="text-xs text-slate-500 font-medium">
                        Showing <strong id="alertsDisplayCount" class="text-slate-900 dark:text-white">7</strong> incidents
                    </div>
                </div>

                <!-- ALERTS CARDS CONTAINER -->
                <div id="alertsContainer" class="space-y-4">
                    <!-- Populated dynamically via alerts.js -->
                </div>

            </div>
        </main>
    </div>

    <!-- JavaScript Files -->
    <script src="auth.js"></script>
    <script src="api.js"></script>
    <script src="alerts.js"></script>
</body>
</html>
