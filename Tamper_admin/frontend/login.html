<!DOCTYPE html>
<html lang="en">
<head>
<script src="common.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>SafeTrack | Secure Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tailwind.css">
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js" integrity="sha384-LtmWBcrD5iuFIR4sFphS8IiiaftkypL5dJzLKywbyd9ATLB7ZbPz3JYnI9nvXHkV" crossorigin="anonymous"></script>
<style>
body{font-family:Inter,sans-serif;background:#f8fafc}.login-card{box-shadow:0 20px 60px rgba(15,23,42,.10)}
</style>
<link rel="stylesheet" href="mobile.css">
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-slate-800">
<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <div class="mx-auto mb-4 w-12 h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center shadow-lg shadow-blue-600/20"><i data-lucide="shield-check" class="w-6 h-6"></i></div>
    <p class="text-[11px] font-bold tracking-[.18em] text-slate-400 uppercase">Shipment Security Platform</p>
    <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900">SafeTrack</h1>
    <p class="mt-2 text-sm text-slate-500">Secure operations console access</p>
  </div>
  <div class="login-card bg-white border border-slate-200 rounded-3xl p-7">
    <div class="mb-6"><h2 class="text-lg font-bold text-slate-900">Sign in</h2><p class="text-xs text-slate-500 mt-1">Use your SafeTrack account credentials.</p></div>
    <form id="loginForm" class="space-y-4">
      <div><label for="username" class="block text-xs font-semibold text-slate-700 mb-1.5">Username</label><input id="username" required autocomplete="username" class="w-full px-3.5 py-3 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="admin"></div>
      <div><label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label><input id="password" type="password" required autocomplete="current-password" class="w-full px-3.5 py-3 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="••••••••"></div>
      <div id="loginError" class="hidden text-xs font-semibold text-rose-600 bg-rose-50 border border-rose-200 rounded-xl px-3 py-2.5"></div>
      <button class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm shadow-md shadow-blue-600/20 transition">Sign in securely</button>
    </form>
    <p class="mt-6 text-xs text-slate-500">Use an account assigned by your administrator.</p>
  </div>
  <p class="text-center text-[11px] text-slate-400 mt-5">JWT-protected SafeTrack Admin Console</p>
</div>
<script src="common.js"></script>
<script src="login.js"></script>
<script>if(window.lucide)lucide.createIcons();</script>
<a href="live.html" style="position:fixed;right:18px;bottom:18px;z-index:9999;background:#2563eb;color:white;padding:12px 18px;border-radius:8px;font:600 14px system-ui;text-decoration:none">Live sensors →</a>
</body></html>
